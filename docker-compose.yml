# Sobe o AutoPost em 3 serviços que compartilham as pastas e o banco SQLite.
#   docker compose up -d --build
# Painel: http://localhost:8000 (só acessível do próprio PC)
x-base: &base
  build: .
  env_file: .env
  environment:
    AUTOPOST_BASE_DIR: /app
    WATCHER_POLLING: "true"          # Docker Desktop/Windows não repassa eventos de arquivo
  volumes:
    - ./config:/app/config:ro
    - ./inbox:/app/inbox
    - ./processing:/app/processing
    - ./output:/app/output
    - ./published:/app/published
    - ./music:/app/music
    - ./logs:/app/logs
    - ./data:/app/data
    - whisper-models:/root/.cache/huggingface
  restart: unless-stopped

services:
  watcher:
    <<: *base
    command: python -m src.main watch

  bot:
    <<: *base
    command: python -m src.main bot
    volumes:
      - ./config:/app/config:ro
      - ./inbox:/app/inbox
      - ./processing:/app/processing
      - ./output:/app/output
      - ./published:/app/published
      - ./logs:/app/logs
      - ./data:/app/data
      # arquivos baixados pelo Local Bot API Server (caminho absoluto devolvido pelo getFile)
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api:ro

  panel:
    <<: *base
    command: python -m src.main review
    environment:
      AUTOPOST_BASE_DIR: /app
      REVIEW_HOST: 0.0.0.0           # dentro do container; o mapeamento abaixo limita ao localhost do PC
    ports:
      - "127.0.0.1:8000:8000"

  # Opcional: servidor local da Bot API para vídeos > 20 MB pelo Telegram.
  #   docker compose --profile telegram-local up -d
  # e no .env: TELEGRAM_API_BASE=http://telegram-bot-api:8081 (veja README)
  telegram-bot-api:
    profiles: ["telegram-local"]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./data/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  whisper-models:
