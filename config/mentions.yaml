# ============================================================
# Marcações autorizadas (@). O sistema NUNCA inventa @.
# Só marca automaticamente quem estiver nesta lista com "auto_marcar: true".
# Qualquer outra pessoa/marca detectada vira apenas SUGESTÃO no painel.
#
# LGPD: "consentimento_imagem: true" é obrigatório para que a pessoa seja
# marcada com base na presença dela no vídeo/foto. Sem consentimento registrado,
# a marcação só pode vir de palavra-chave (nome citado no briefing/fala/texto).
# O sistema NÃO faz reconhecimento facial.
# ============================================================
perfis:
