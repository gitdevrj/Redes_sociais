    nome: "Roberto Junior"
    tipo: proprio              # proprio | parceiro | cliente | colaborador | fornecedor
    handles:
      instagram: "@robertojunior.up"
      facebook: ""
      linkedin: ""             # URN, ex.: urn:li:person:XXXX (preencher na Fase 3)
    palavras_chave: []
    logos: []
    consentimento_imagem: true
    consentimento_registrado_em: "2026-11-14"
    auto_marcar: false         # é o próprio perfil: não precisa marcar

