<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AutoPost{% endblock %}</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#5c6b80;--line:#dfe5ee;--pri:#0B2545;--acc:#F2C14E;--ok:#1b7f4b;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:600}header .sp{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e8edf5;color:var(--ink)}
.b-dry{background:var(--acc);color:#222}.b-gerado{background:#e3f0ff}.b-aprovado,.b-agendado{background:#dff5e8;color:var(--ok)}
.b-erro{background:#fde7e5;color:var(--bad)}.b-descartado{background:#eee;color:#777}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
textarea,input[type=text],input[type=datetime-local]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px}
textarea{min-height:150px}
.grid{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.media img,.media video{max-width:100%;border-radius:8px;display:block;margin-bottom:8px}
.muted{color:var(--muted);font-size:13px}.alert{background:#fff4e0;border:1px solid #f0d199;padding:8px 12px;border-radius:6px;margin:6px 0}
.risk{background:#fde7e5;border:1px solid #f3b8b2}
.msg{background:#e3f0ff;border:1px solid #b5d3ff;padding:10px;border-radius:6px;margin-bottom:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:#e8edf5}
.b-pri{background:var(--pri);color:#fff}.b-ok{background:var(--ok);color:#fff}.b-bad{background:var(--bad);color:#fff}
.var{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.var label{font-weight:600;text-transform:capitalize}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#ddd}
h2{margin:0 0 8px}h3{margin:16px 0 8px}
details summary{cursor:pointer;color:var(--muted)}
pre{white-space:pre-wrap;font-size:12px;background:#f3f5f9;padding:8px;border-radius:6px;max-height:300px;overflow:auto}
</style>
</head>
<body>
<header><a href="/">AutoPost</a><span class="sp"></span>
{% if dry_run %}<span class="badge b-dry">DRY-RUN — nada é publicado</span>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
</body></html>
